<script>
/**
 * script.html - Frontend JavaScript moduli
 * DKP - Hisobot tahlili tizimi
 *
 * Modullar: Loading, Toast, API, Dashboard.
 * Backend google.script.run orqali apiXxx funksiyalarini chaqiradi va
 * { success, data, message } JSON javobini qaytaradi.
 */

// ============================================================
// LOADING
// ============================================================
const Loading = (() => {
  'use strict';
  let _counter = 0;
  const el = () => document.getElementById('overlay');
  const show = () => { _counter++; const o = el(); if (o) o.classList.add('on'); };
  const hide = () => { _counter = Math.max(0, _counter - 1); if (_counter === 0) { const o = el(); if (o) o.classList.remove('on'); } };
  return { show, hide };
})();

// ============================================================
// TOAST
// ============================================================
const Toast = (() => {
  'use strict';
  const container = () => {
    let c = document.getElementById('toastContainer');
    if (!c) { c = document.createElement('div'); c.className = 'toast-container'; c.id = 'toastContainer'; document.body.appendChild(c); }
    return c;
  };
  const show = (message, type = 'success', duration = 4000) => {
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    t.textContent = message;
    container().appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, duration);
  };
  return { show, success: (m) => show(m, 'success'), error: (m) => show(m, 'error'), warning: (m) => show(m, 'warning') };
})();

// ============================================================
// API - Backend bilan aloqa
// ============================================================
const API = (() => {
  'use strict';
  const call = (fn, ...args) => new Promise((resolve, reject) => {
    try {
      Loading.show();
      google.script.run
        .withSuccessHandler((response) => {
          Loading.hide();
          const result = typeof response === 'string' ? JSON.parse(response) : response;
          if (result && result.success) { resolve(result.data); }
          else { reject((result && result.message) || 'Server xatoligi'); }
        })
        .withFailureHandler((error) => { Loading.hide(); reject((error && error.message) || String(error)); })
        [fn](...args);
    } catch (e) { Loading.hide(); reject('API chaqiruv xatosi: ' + e.message); }
  });
  return {
    getInitialState: () => call('apiGetInitialState'),
    runQuery: (payload) => call('apiRunQuery', payload),
    exportData: (payload) => call('apiExportData', payload)
  };
})();
</script>

<script>
// ============================================================
// DASHBOARD - asosiy interfeys logikasi
// ============================================================
const Dashboard = (() => {
  'use strict';

  let STATE = null;
  let FILTERS = {};
  let CONTROLS = { groupDim: null, measureKey: null, agg: 'count', dateKey: null, page: 1, sortKey: '', sortDir: 'asc', search: '' };
  let LAST = null;
  let chartsReady = false;
  let queryTimer = null;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmtNum = (n) => {
    if (n === null || n === undefined || n === '') return '0';
    const x = Number(n);
    if (!isFinite(x)) return String(n);
    const rounded = Math.round(x * 100) / 100;
    const parts = String(rounded).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return parts.join('.');
  };
  const findCol = (key) => {
    const all = (STATE && STATE.columns) || [];
    for (let i = 0; i < all.length; i++) if (all[i].key === key) return all[i];
    return null;
  };

  // ---- charts loader ----
  const initCharts = () => {
    google.charts.load('current', { packages: ['corechart'] });
    google.charts.setOnLoadCallback(() => { chartsReady = true; if (LAST) drawCharts(LAST); });
  };

  // ---- boot ----
  const init = () => {
    API.getInitialState().then(onInitial).catch((e) => Toast.error('Yuklashda xatolik: ' + e));
  };

  const onInitial = (state) => {
    STATE = state;
    $('title').textContent = state.app.name;
    $('sheetMeta').textContent = '• ' + state.sheetName + ' • ' + fmtNum(state.rowCount) + ' ta yozuv';
    CONTROLS.groupDim = state.defaults.groupDim;
    CONTROLS.measureKey = state.defaults.measureKey;
    CONTROLS.agg = state.defaults.agg;
    CONTROLS.dateKey = state.defaults.dateKey;
    buildControls(state);
    buildDimFilters(state);
    buildNumFilters(state);
    buildDateCols(state);
    bindGlobal();
    applyResult(state.query);
  };

  // ---- controls ----
  const buildControls = (state) => {
    const g = $('groupDim'); g.innerHTML = '';
    state.dimensions.forEach((c) => { const o = document.createElement('option'); o.value = c.key; o.textContent = c.label; if (c.key === CONTROLS.groupDim) o.selected = true; g.appendChild(o); });
    const m = $('measureKey'); m.innerHTML = '<option value="">— (yozuvlar soni)</option>';
    state.measures.forEach((c) => { const o = document.createElement('option'); o.value = c.key; o.textContent = c.label; if (c.key === CONTROLS.measureKey) o.selected = true; m.appendChild(o); });
    $('aggKey').value = CONTROLS.agg;
    const t = $('trendDate'); t.innerHTML = '<option value="">— sana ustuni yo\'q</option>';
    state.dateColumns.forEach((c) => { const o = document.createElement('option'); o.value = c.key; o.textContent = c.label; if (c.key === CONTROLS.dateKey) o.selected = true; t.appendChild(o); });

    g.onchange = () => { CONTROLS.groupDim = g.value; query(); };
    m.onchange = () => {
      CONTROLS.measureKey = m.value || null;
      if (!CONTROLS.measureKey) { CONTROLS.agg = 'count'; $('aggKey').value = 'count'; }
      else if (CONTROLS.agg === 'count') { CONTROLS.agg = 'sum'; $('aggKey').value = 'sum'; }
      query();
    };
    $('aggKey').onchange = () => { CONTROLS.agg = $('aggKey').value; query(); };
    t.onchange = () => { CONTROLS.dateKey = t.value || null; query(); };
  };

  const buildDateCols = (state) => {
    const d = $('dateColSelect'); d.innerHTML = '<option value="">— tanlang —</option>';
    state.dateColumns.forEach((c) => { const o = document.createElement('option'); o.value = c.key; o.textContent = c.label; d.appendChild(o); });
    if (state.dateColumns.length) d.value = state.dateColumns[0].key;
    const applyDate = () => {
      const key = d.value, from = $('dateFrom').value, to = $('dateTo').value;
      Object.keys(FILTERS).forEach((k) => { if (FILTERS[k] && FILTERS[k].type === 'dateRange') delete FILTERS[k]; });
      if (key && (from || to)) FILTERS[key] = { type: 'dateRange', from: from || null, to: to || null };
      CONTROLS.page = 1; query();
    };
    d.onchange = applyDate; $('dateFrom').onchange = applyDate; $('dateTo').onchange = applyDate;
  };

  // ---- dimension multi-selects ----
  const buildDimFilters = (state) => {
    const host = $('dimFilters'); host.innerHTML = '';
    if (!state.dimensions.length) { host.innerHTML = '<div class="empty">Filtr ustunlari topilmadi</div>'; return; }
    state.dimensions.forEach((col) => host.appendChild(makeMultiSelect(col, (state.query.options || {})[col.key] || [])));
  };

  const makeMultiSelect = (col, options) => {
    const wrap = document.createElement('div'); wrap.className = 'ms'; wrap.dataset.key = col.key;
    const btn = document.createElement('button'); btn.className = 'ms-btn';
    btn.innerHTML = '<span class="lbl">' + esc(col.label) + '</span><span class="cnt">0</span>';
    const panel = document.createElement('div'); panel.className = 'ms-panel';
    const srch = document.createElement('div'); srch.className = 'ms-search';
    srch.innerHTML = '<input type="text" placeholder="qidirish...">';
    panel.appendChild(srch);
    const list = document.createElement('div'); list.className = 'ms-list';
    panel.appendChild(list);
    wrap.appendChild(btn); wrap.appendChild(panel);
    renderOptions(list, col.key, options);
    btn.onclick = (e) => {
      e.stopPropagation();
      document.querySelectorAll('.ms-panel.open').forEach((p) => { if (p !== panel) p.classList.remove('open'); });
      panel.classList.toggle('open');
    };
    srch.querySelector('input').oninput = function () {
      const t = this.value.toLowerCase();
      list.querySelectorAll('.ms-opt').forEach((o) => { o.style.display = o.dataset.v.toLowerCase().indexOf(t) !== -1 ? '' : 'none'; });
    };
    return wrap;
  };

  const renderOptions = (list, key, options) => {
    const selected = (FILTERS[key] && FILTERS[key].values) ? FILTERS[key].values.slice() : [];
    const union = options.slice();
    selected.forEach((v) => { if (union.indexOf(v) === -1) union.push(v); });
    list.innerHTML = '';
    union.forEach((v) => {
      const row = document.createElement('label'); row.className = 'ms-opt'; row.dataset.v = String(v);
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.value = String(v);
      cb.checked = selected.indexOf(String(v)) !== -1 || selected.indexOf(v) !== -1;
      cb.onchange = () => onDimChange(key, list);
      const sp = document.createElement('span'); sp.textContent = String(v);
      row.appendChild(cb); row.appendChild(sp); list.appendChild(row);
    });
    updateMsCount(key, list);
  };

  const onDimChange = (key, list) => {
    const vals = [];
    list.querySelectorAll('input[type=checkbox]').forEach((cb) => { if (cb.checked) vals.push(cb.value); });
    if (vals.length) FILTERS[key] = { type: 'in', values: vals }; else delete FILTERS[key];
    updateMsCount(key, list);
    CONTROLS.page = 1; query();
  };

  const updateMsCount = (key, list) => {
    const wrap = list.closest('.ms');
    wrap.querySelector('.cnt').textContent = list.querySelectorAll('input[type=checkbox]:checked').length;
  };

  // ---- numeric range filters ----
  const buildNumFilters = (state) => {
    const host = $('numFilters'); host.innerHTML = '';
    if (!state.measures.length) { host.innerHTML = '<div class="empty">Raqamli ustun yo\'q</div>'; return; }
    state.measures.forEach((col) => {
      const f = document.createElement('div'); f.className = 'field';
      f.innerHTML = '<label>' + esc(col.label) + '</label><div class="row2"><input type="number" placeholder="min"><input type="number" placeholder="max"></div>';
      const ins = f.querySelectorAll('input');
      const apply = () => {
        const mn = ins[0].value, mx = ins[1].value;
        if (mn !== '' || mx !== '') FILTERS[col.key] = { type: 'numberRange', min: mn === '' ? null : Number(mn), max: mx === '' ? null : Number(mx) };
        else delete FILTERS[col.key];
        CONTROLS.page = 1; query();
      };
      ins[0].onchange = apply; ins[1].onchange = apply;
      host.appendChild(f);
    });
  };

  const bindGlobal = () => {
    document.addEventListener('click', () => { document.querySelectorAll('.ms-panel.open').forEach((p) => p.classList.remove('open')); });
    $('globalSearch').addEventListener('input', function () {
      CONTROLS.search = this.value; CONTROLS.page = 1;
      clearTimeout(queryTimer); queryTimer = setTimeout(query, 300);
    });
    $('refreshBtn').onclick = () => init();
    $('printBtn').onclick = () => window.print();
    $('exportBtn').onclick = () => doExport();
    $('resetBtn').onclick = () => {
      FILTERS = {}; CONTROLS.search = ''; CONTROLS.page = 1; CONTROLS.sortKey = '';
      $('globalSearch').value = ''; $('dateFrom').value = ''; $('dateTo').value = '';
      document.querySelectorAll('#numFilters input').forEach((i) => { i.value = ''; });
      query();
    };
    $('prevPage').onclick = () => { if (CONTROLS.page > 1) { CONTROLS.page--; query(); } };
    $('nextPage').onclick = () => {
      const max = Math.ceil((LAST ? LAST.total : 0) / (LAST ? LAST.table.pageSize : 50));
      if (CONTROLS.page < max) { CONTROLS.page++; query(); }
    };
  };

  // ---- query ----
  const payload = () => ({
    filters: FILTERS, search: CONTROLS.search, groupDim: CONTROLS.groupDim,
    measureKey: CONTROLS.measureKey, agg: CONTROLS.agg, dateKey: CONTROLS.dateKey,
    page: CONTROLS.page, sortKey: CONTROLS.sortKey, sortDir: CONTROLS.sortDir
  });
  const query = () => { API.runQuery(payload()).then(applyResult).catch((e) => Toast.error('So\'rov xatosi: ' + e)); };

  const doExport = () => {
    API.exportData(payload()).then((res) => {
      const blob = new Blob(['\uFEFF' + res.content], { type: res.mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = res.filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
      Toast.success(fmtNum(res.rowCount) + ' ta yozuv eksport qilindi');
    }).catch((e) => Toast.error('Eksport xatosi: ' + e));
  };

  const applyResult = (res) => {
    LAST = res;
    renderKpis(res); renderFinance(res); renderRanking(res); renderSummary(res); renderTable(res); refreshDimOptions(res);
    if (chartsReady) drawCharts(res);
  };

  const refreshDimOptions = (res) => {
    if (!res.options) return;
    document.querySelectorAll('#dimFilters .ms').forEach((wrap) => {
      renderOptions(wrap.querySelector('.ms-list'), wrap.dataset.key, res.options[wrap.dataset.key] || []);
    });
  };

  const renderKpis = (res) => {
    const host = $('kpis'); host.innerHTML = '';
    addKpi(host, 'Jami yozuvlar', fmtNum(res.total));
    (res.kpis.measures || []).forEach((m) => {
      const col = findCol(m.key);
      addKpi(host, (col ? col.label : m.key) + ' (yig\'indi)', fmtNum(m.sum), 'o\'rtacha: ' + fmtNum(m.avg));
    });
  };
  const addKpi = (host, label, value, sub) => {
    const d = document.createElement('div'); d.className = 'kpi';
    d.innerHTML = '<div class="label">' + esc(label) + '</div><div class="value">' + esc(value) + '</div>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '');
    host.appendChild(d);
  };

  const renderFinance = (res) => {
    const host = $('financeKpis'); host.innerHTML = '';
    const f = res.finance;
    if (!f) return;
    const card = (cls, label, value, sub) => {
      const d = document.createElement('div'); d.className = 'kpi ' + cls;
      d.innerHTML = '<div class="label">' + esc(label) + '</div><div class="value">' + esc(value) + '</div>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '');
      host.appendChild(d);
    };
    card('', 'Hisoblangan summa', fmtNum(f.invoice));
    card('', 'To\'langan summa', fmtNum(f.paid), 'yig\'ilish: ' + f.collectionPercent + '%');
    card('debt', 'Qarz (to\'lanmagan)', fmtNum(f.debt));
    card('pending', 'Yig\'ilish darajasi', f.collectionPercent + '%');
  };

  const renderRanking = (res) => {
    const host = $('ranking'); host.innerHTML = '';
    const data = (res.ranking && res.ranking.data) || [];
    if (!data.length) { host.innerHTML = '<div class="empty">Ma\'lumot yo\'q</div>'; return; }
    data.forEach((it, i) => {
      const row = document.createElement('div'); row.className = 'rank-item';
      row.innerHTML = '<span class="pos">' + (i + 1) + '</span><span class="nm">' + esc(it.label) + '</span><span class="vl">' + fmtNum(it.value) + '</span>';
      host.appendChild(row);
    });
  };

  const renderSummary = (res) => {
    const gc = findCol(res.category.dim);
    const mc = findCol(res.category.measureKey);
    const aggTxt = { count: 'Soni', sum: 'Yig\'indi', avg: 'O\'rtacha' }[res.category.agg] || res.category.agg;
    const active = Object.keys(res.filters || {}).length + (CONTROLS.search ? 1 : 0);
    $('summary').innerHTML =
      'Guruhlash: <b>' + esc(gc ? gc.label : '—') + '</b><br>' +
      'Ko\'rsatkich: <b>' + esc(mc ? mc.label : 'Yozuvlar soni') + '</b><br>' +
      'Hisoblash: <b>' + esc(aggTxt) + '</b><br>' +
      'Faol filtrlar: <b>' + active + '</b><br>' +
      'Natija: <b>' + fmtNum(res.total) + '</b> yozuv';
  };

  const renderTable = (res) => {
    const tbl = $('dataTable');
    const thead = tbl.tHead || tbl.createTHead();
    const tbody = tbl.tBodies[0] || tbl.createTBody();
    thead.innerHTML = ''; tbody.innerHTML = '';
    const tr = document.createElement('tr');
    res.table.columns.forEach((c) => {
      const th = document.createElement('th');
      th.textContent = c.label + (CONTROLS.sortKey === c.key ? (CONTROLS.sortDir === 'asc' ? ' \u25B2' : ' \u25BC') : '');
      th.onclick = () => {
        if (CONTROLS.sortKey === c.key) CONTROLS.sortDir = CONTROLS.sortDir === 'asc' ? 'desc' : 'asc';
        else { CONTROLS.sortKey = c.key; CONTROLS.sortDir = 'asc'; }
        query();
      };
      tr.appendChild(th);
    });
    thead.appendChild(tr);
    res.table.rows.forEach((row) => {
      const r = document.createElement('tr');
      row.forEach((cell, ci) => {
        const td = document.createElement('td');
        const type = res.table.columns[ci].type;
        td.textContent = (type === 'number' && cell !== '') ? fmtNum(cell) : cell;
        if (type === 'number') td.style.textAlign = 'right';
        r.appendChild(td);
      });
      tbody.appendChild(r);
    });
    const from = res.total ? (res.table.page - 1) * res.table.pageSize + 1 : 0;
    const to = Math.min(res.table.page * res.table.pageSize, res.total);
    $('pageInfo').textContent = from + '–' + to + ' / ' + fmtNum(res.total);
    $('tableCount').textContent = fmtNum(res.total) + ' yozuv';
    $('prevPage').disabled = res.table.page <= 1;
    $('nextPage').disabled = to >= res.total;
  };

  // ---- charts ----
  const drawCharts = (res) => { drawPie(res); drawColumn(res); drawLine(res); drawSla(res); };
  const toDataTable = (rows) => {
    const dt = new google.visualization.DataTable();
    dt.addColumn('string', 'Nomi'); dt.addColumn('number', 'Qiymat');
    rows.forEach((r) => dt.addRow([r.label, Number(r.value) || 0]));
    return dt;
  };
  const drawPie = (res) => {
    const el = $('pie'); const data = (res.category && res.category.data) || [];
    if (!data.length) { el.innerHTML = '<div class="empty">Ma\'lumot yo\'q</div>'; return; }
    new google.visualization.PieChart(el).draw(toDataTable(data), { colors: STATE.palette, pieHole: 0.4, legend: { position: 'right' }, chartArea: { width: '90%', height: '85%' }, height: 300 });
  };
  const drawColumn = (res) => {
    const el = $('col'); const data = (res.category && res.category.data) || [];
    if (!data.length) { el.innerHTML = '<div class="empty">Ma\'lumot yo\'q</div>'; return; }
    new google.visualization.ColumnChart(el).draw(toDataTable(data), { colors: [STATE.palette[0]], legend: { position: 'none' }, chartArea: { width: '85%', height: '70%' }, height: 300, hAxis: { slantedText: true, slantedTextAngle: 30 } });
  };
  const drawLine = (res) => {
    const el = $('line'); const data = (res.trend && res.trend.data) || [];
    if (!data.length) { el.innerHTML = '<div class="empty">Trend uchun sana ustuni tanlang yoki ma\'lumot yo\'q</div>'; return; }
    new google.visualization.AreaChart(el).draw(toDataTable(data), { colors: [STATE.palette[0]], legend: { position: 'none' }, chartArea: { width: '90%', height: '75%' }, height: 300, areaOpacity: 0.15, pointSize: 4 });
  };

  const drawSla = (res) => {
    const el = $('slaChart'); const legend = $('slaLegend');
    const sla = res.sla; legend.innerHTML = '';
    if (!sla || !sla.items.length) {
      el.innerHTML = '<div class="empty">SLA uchun sana ustuni topilmadi</div>';
      return;
    }
    const dt = new google.visualization.DataTable();
    dt.addColumn('string', 'Holat'); dt.addColumn('number', 'Soni');
    const colors = [];
    sla.items.forEach((it) => { dt.addRow([it.label, it.value]); colors.push(it.color); });
    new google.visualization.PieChart(el).draw(dt, {
      colors: colors, pieHole: 0.5, legend: { position: 'none' },
      chartArea: { width: '92%', height: '88%' }, height: 240
    });
    sla.items.forEach((it) => {
      const b = document.createElement('span'); b.className = 'sla-badge';
      b.innerHTML = '<span class="dot" style="background:' + it.color + '"></span>' +
        esc(it.label) + ' <span class="n">' + fmtNum(it.value) + '</span>';
      legend.appendChild(b);
    });
  };

  return { init, initCharts };
})();

window.addEventListener('load', () => { Dashboard.initCharts(); Dashboard.init(); });
</script>
